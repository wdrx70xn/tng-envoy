name: CodeQL/daily
permissions:
  contents: read
'on':
  schedule:
  - cron: 0 12 * * 4
concurrency:
  group: ${{ github.head_ref || github.run_id }}-${{ github.workflow }}
  cancel-in-progress: true
jobs:
  CodeQL-Build:
    permissions:
      security-events: write
      pull-requests: read
    strategy:
      fail-fast: false
    runs-on: ubuntu-latest
    if: github.repository == 'envoyproxy/envoy'
    steps:
    - name: Checkout repository
      uses: actions/checkout@9bb56186c3b09b4f86b1c65136769dd318469633
    - name: Free disk space
      uses: envoyproxy/toolshed/gh-actions/diskspace@actions-v0.2.30
      with:
        to_remove: '/usr/local/lib/android

          '
    - name: Initialize CodeQL
      uses: github/codeql-action/init@cdcdbb579706841c47f7063dda365e292e5cad7a
      with:
        languages: cpp
    - name: Install deps
      shell: bash
      run: 'sudo apt-get update --error-on=any

        sudo apt-get install --yes libtool cmake automake autoconf make ninja-build
        curl unzip virtualenv openjdk-11-jdk build-essential libc++1

        # Note: the llvm/clang version should match the version specifed in:

        #  - bazel/repository_locations.bzl

        #  - .github/workflows/codeql-push.yml

        #  - https://github.com/envoyproxy/envoy-build-tools/blob/main/build_container/build_container_ubuntu.sh#L84

        mkdir -p bin/clang14

        cd bin/clang14

        wget https://github.com/llvm/llvm-project/releases/download/llvmorg-14.0.0/clang+llvm-14.0.0-x86_64-linux-gnu-ubuntu-18.04.tar.xz

        tar -xf clang+llvm-14.0.0-x86_64-linux-gnu-ubuntu-18.04.tar.xz --strip-components
        1

        export PATH=bin/clang14/bin:$PATH

        '
    - name: Build
      run: 'bazel/setup_clang.sh bin/clang14

        bazelisk shutdown

        bazelisk build -c fastbuild --spawn_strategy=local --discard_analysis_cache
        --nouse_action_cache --config clang --config libc++ //source/common/http/...

        '
    - name: Clean Artifacts
      run: 'git clean -xdf

        '
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@cdcdbb579706841c47f7063dda365e292e5cad7a
